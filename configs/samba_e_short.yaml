variant: SAMBA-E
status: paper_window_spatially_diverse
paper_reproduction: false
paper_alignment: architecture, 128-Hz 256-sample window, TSR, objective, optimizer
sampling_rate: 128
target_montage: Montage/standard_1020_positions.xlsx
reconstruction_space: fixed_original_channels_via_coordinate_decoder

data:
  batching: source_homogeneous_fixed_256_sample_microbatches
  normalization: per_window_per_channel_abs_q95
  split_policy: subject_disjoint_train_and_ssl_validation

model:
  base_channels: 64
  bottleneck_channels: 128
  d_state: 16
  d_conv: 2
  expand: 8
  head_dim: 16
  cdse_hidden_dim: 32
  mixer_backend: mamba2
  reconstruction_mode: input_coordinates

objective:
  masking: temporal_semantic_random
  mask_ratio: 0.5
  time_loss: l1
  frequency_loss: full_window_rfft
  frequency_normalization: null
  time_weight: 1.0
  frequency_weight: 1.0

training:
  seed: 3407
  sampler: uniformly_weighted_sources
  epochs: 200
  # Paper SAMBA-E uses about 311k windows / global batch 4096 ~= 76 updates.
  optimizer_steps_per_epoch: 76
  reference_window_samples: 256
  micro_batch_size: 256
  gradient_accumulation_steps: 16
  workers_per_source: 2
  max_total_workers: 16
  prefetch_factor: 2
  channel_dropout: 0.0
  initial_lr: 2.5e-4
  max_lr: 5.0e-4
  final_lr: 5.0e-6
  warmup_fraction: 0.1
  weight_decay: 0.01
  validation_batches_per_source: 32
  fixed_validation_mask: true
  save_every: 10
  precision: fp32

evaluation:
  neuralbench: true
  wrapper: linear_probe_statistics
