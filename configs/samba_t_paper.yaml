variant: SAMBA-T
status: paper_aligned_tuab100
paper_reproduction: false
paper_alignment: strict architecture, TUAB100 window, TSR, objective, optimizer
known_deviation: recovered raw TUAB train split uses a new recording-disjoint SSL validation split
sampling_rate: 128
target_montage: Montage/standard_1020_positions.xlsx
reconstruction_space: fixed_original_tuab_channels

data:
  batching: homogeneous_tuab100_microbatches
  normalization: per_window_per_channel_abs_q95
  split_policy: recording_disjoint_train_and_ssl_validation

model:
  base_channels: 64
  bottleneck_channels: 128
  d_state: 16
  d_conv: 2
  expand: 8
  head_dim: 16
  cdse_hidden_dim: 32
  mixer_backend: mamba2
  reconstruction_mode: fixed_input
  reconstruction_channels: 16

objective:
  masking: temporal_semantic_random
  mask_ratio: 0.5
  time_loss: l1
  frequency_loss: full_window_rfft
  frequency_normalization: null
  time_weight: 1.0
  frequency_weight: 1.0

training:
  seed: 3407
  sampler: single_source
  epochs: 200
  # 30,853 train windows / global batch 64 = 483 updates per epoch.
  optimizer_steps_per_epoch: 483
  reference_window_samples: 12800
  micro_batch_size: 4
  gradient_accumulation_steps: 16
  workers_per_source: 0
  max_total_workers: 8
  prefetch_factor: 2
  channel_dropout: 0.0
  initial_lr: 2.5e-4
  max_lr: 5.0e-4
  final_lr: 5.0e-6
  warmup_fraction: 0.1
  weight_decay: 0.01
  validation_batches_per_source: 32
  fixed_validation_mask: true
  save_every: 10
  precision: fp32

evaluation:
  neuralbench: true
  wrapper: linear_probe_statistics
