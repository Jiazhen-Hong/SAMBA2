# Paper-aligned SAMBA-T pretraining defaults. Paths are intentionally local.
variant: SAMBA-T
sampling_rate: 128
window_samples: 12800
input_channels: 16
target_montage: Montage/standard_1020_positions.xlsx
model:
  base_channels: 64
  bottleneck_channels: 128
  d_state: 16
  d_conv: 2
  expand: 8
  head_dim: 16
  cdse_hidden_dim: 32
  mixer_backend: mamba2
training:
  epochs: 200
  batch_size: 64
  mask_ratio: 0.5
  optimizer: AdamW
  weight_decay: 0.01
  scheduler: OneCycleLR
  max_lr: 0.0005
  initial_lr: 0.00025
  final_lr: 0.000005
  warmup_fraction: 0.1
data:
  manifest: null  # Required: TUAB subject-wise split manifest and processed shards.
