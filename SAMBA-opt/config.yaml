variant: SAMBA-opt
track: experimental
paper_locked: false
status: design_only
sampling_rate: 128
durations_seconds: [2, 10, 30, 60, 100]
reconstruction_space: common_cdse_target
duration_mixing: true
model:
  base_channels: 64
  bottleneck_channels: 128
  d_state: 16
  d_conv: 2
  expand: 8
  head_dim: 16
  cdse_hidden_dim: 32
  mixer_backend: mamba2
objective:
  masking: temporal_semantic_random
  mask_ratio: 0.5
  time_loss: l1
  frequency_loss: fixed_window_stft
training:
  sampler: duration_bucketed
  gradient_accumulation: multi_duration
evaluation:
  neuralbench: true
  wrapper: linear_probe_mean
